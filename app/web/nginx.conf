map $uri $cache_control {
    ~^/(fonts|vendor)/  "public, max-age=31536000, immutable";
    /auth-bg.webp       "public, max-age=604800";
    ~^/covers/          "public, max-age=604800";
    default             "no-cache";
}

# demo.maiday.julqaj.com: the same files, but the start page is the demo build (adapt.py → demo.html)
map $host $home_page {
    demo.maiday.julqaj.com  /demo.html;
    default                 /index.html;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 'unsafe-inline': the app is a single file with inline <script>, <style> and style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = / {
        try_files $home_page =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
