name: web

on:
  push:
    branches: [main]
    paths: ['app/web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: app/web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maiday-web:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/maiday-web:main

      # GitOps: the new tag lands in Git, Argo CD rolls it out.
      - name: Bump image tag
        run: |
          sed -i "s/^\(\s*newTag:\).*/\1 ${{ steps.tag.outputs.tag }}/" infra/apps/maiday/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "maiday-web: ${{ steps.tag.outputs.tag }}" || exit 0
          git push
