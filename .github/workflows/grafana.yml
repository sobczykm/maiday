name: grafana

# Dashboards are edited as JSON in infra/grafana/dashboards and pushed to Grafana Cloud on every change.
on:
  push:
    branches: [main]
    paths: ['infra/grafana/**', '.github/workflows/grafana.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboards:
    runs-on: ubuntu-latest
    env:
      GRAFANA_URL: https://fondzinnia691.grafana.net
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      FOLDER_UID: maiday
    steps:
      - uses: actions/checkout@v5

      # Creating is idempotent: 409/412 mean the folder already exists.
      # (A GET of a missing folder returns 403 for Editor service accounts, so it can't be used as a check.)
      - name: Ensure the Maiday folder exists
        run: |
          status=$(curl -s -o /tmp/folder.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GRAFANA_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"uid\":\"$FOLDER_UID\",\"title\":\"Maiday\"}" "$GRAFANA_URL/api/folders")
          case "$status" in
            200|409|412) echo "folder ok ($status)" ;;
            *) echo "Grafana returned $status creating the folder:"; cat /tmp/folder.json; exit 1 ;;
          esac

      - name: Upload dashboards
        run: |
          for file in infra/grafana/dashboards/*.json; do
            status=$(jq --arg folder "$FOLDER_UID" --arg msg "${GITHUB_SHA::7}" \
              '{dashboard: (. + {id: null}), folderUid: $folder, overwrite: true, message: $msg}' "$file" |
              curl -s -o /tmp/dashboard.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GRAFANA_TOKEN" -H 'Content-Type: application/json' \
                --data-binary @- "$GRAFANA_URL/api/dashboards/db")
            echo "$status $file"
            [ "$status" = "200" ] || { cat /tmp/dashboard.json; exit 1; }
          done
