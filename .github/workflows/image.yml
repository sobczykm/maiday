name: image

on:
  workflow_call:
    inputs:
      name:
        description: Component in app/<name>, published as ghcr.io/<owner>/maiday-<name>
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: gitops-image-bump
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/maiday-${{ inputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: app/${{ inputs.name }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:main

      - name: Point infra at the new image (Argo CD deploys it)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          (cd infra/apps/maiday && kustomize edit set image "$IMAGE:${{ steps.tag.outputs.tag }}")
          git commit -am "maiday-${{ inputs.name }}: ${{ steps.tag.outputs.tag }}" || exit 0
          git push origin HEAD:main
