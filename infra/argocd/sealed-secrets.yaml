# Decrypts SealedSecret manifests from Git into regular Secrets.
# Name/namespace match kubeseal defaults (sealed-secrets-controller in kube-system).
# Back up the controller's private key (Secret with label sealedsecrets.bitnami.com/sealed-secrets-key)
# outside the cluster: without it, sealed secrets in Git cannot be decrypted on a new cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
