# Metrics agent: scrapes the cluster and remote-writes to Grafana Cloud.
# Config lives in infra/apps/monitoring/config.alloy; the token in the SealedSecret grafana-cloud.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.0
    helm:
      valuesObject:
        controller:
          type: deployment
          replicas: 1
        alloy:
          configMap:
            create: false
            name: alloy-config
            key: config.alloy
          envFrom:
            - secretRef:
                name: grafana-cloud
          enableReporting: false
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 320Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
