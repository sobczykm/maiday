# Cluster object state (pod restarts, readiness, deployment replicas) for Alloy to scrape.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-state-metrics
    targetRevision: 8.6.0
    helm:
      valuesObject:
        collectors:
          - deployments
          - nodes
          - pods
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 96Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
