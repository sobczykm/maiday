# Ingress controller. Its Service is the cluster's only LoadBalancer (paid on DOKS).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.7.1
    helm:
      valuesObject:
        ingressClass:
          enabled: true
          isDefaultClass: true
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
