apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
- grafana-cloud.sealed.yaml
# Alloy (infra/argocd/alloy.yaml) mounts this ConfigMap and reloads it on change.
configMapGenerator:
- name: alloy-config
  files:
  - config.alloy
generatorOptions:
  disableNameSuffixHash: true
