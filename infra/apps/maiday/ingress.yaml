apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maiday
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: maiday-redirect-https@kubernetescrd
spec:
  tls:
    - hosts: [maiday.julqaj.com]
      secretName: maiday-tls
  rules:
    - host: maiday.julqaj.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /_blob
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
